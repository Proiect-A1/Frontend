name: Deploy to Prod

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Deploy Frontend
    runs-on: ubuntu-latest

    steps:
      - name: Executing remote SSH commands
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USERNAME }}
          key: ${{ secrets.VM_SSH_KEY }}
          script_stop: true
          script: |
            set -e 
            echo "Frontend deployment has started..."

            # Mergem în folderul corespondent pentru Frontend
            cd ~/fiicoder/prod/Frontend

            # Punem deoparte orice modificare locala facuta manual pe VM (nu o stergem -
            # ramane recuperabila cu `git stash show -p` daca cineva vrea s-o verifice),
            # ca sa nu blocheze checkout-ul de mai jos.
            git stash --include-untracked

            # Ne asigurăm că tragem de pe branch-ul de main. Folosim @{u} (upstream-ul
            # configurat de git pentru branch-ul curent) in loc de un nume de remote
            # hardcodat - numele remote-ului pe acest checkout nu era "frontend"
            # (era "prod-frontend"), ceea ce bloca acest pas complet.
            git fetch --all
            git checkout main
            git reset --hard @{u}
            git clean -fd

            # Ne întoarcem la root /home/github/sandbox și refacem containerul
            cd ../

            # Numele real al serviciului de prod (confirmat prin `docker compose config
            # --services` pe VM) e "frontend", nu "prod-frontend" - containerul rulant
            # se numeste "fiicoder-frontend".
            docker compose down frontend
            docker compose build \
              --build-arg VITE_CF_ACCESS_CLIENT_ID=${{ secrets.VITE_CF_ACCESS_CLIENT_ID }} \
              --build-arg VITE_CF_ACCESS_CLIENT_SECRET=${{ secrets.VITE_CF_ACCESS_CLIENT_SECRET }} \
              --build-arg VITE_AI_PROXY_URL=${{ vars.VITE_AI_PROXY_URL }} \
              frontend
            docker compose up -d frontend

            # Cleanup-ul de imagini nu trebuie sa blocheze finalul deploy-ului - il lasam
            # sa ruleze pe fundal.
            docker image prune -f &

            # In loc de sleep fix (nginx porneste de fapt in 1-2s), asteptam activ pana
            # raspunde, cu un plafon de 15s ca sa nu blocam la infinit daca ceva e in
            # neregula.
            # 127.0.0.1, nu localhost: busybox wget rezolva "localhost" la IPv6 (::1)
            # primul, unde conexiunea era refuzata desi nginx asculta pe IPv4 - poll-ul
            # nu reusea niciodata si mergea oricum pana la plafon.
            echo "Astept ca nginx sa raspunda..."
            for i in $(seq 1 15); do
              if docker exec fiicoder-frontend wget -q --spider http://127.0.0.1/ 2>/dev/null; then
                echo "Raspunde dupa ${i}s"
                break
              fi
              sleep 1
            done

            echo "FRONTEND DEPLOYMENT LOGS"
            docker logs fiicoder-frontend
            echo "✅ Frontend deployment has finished successfully!"