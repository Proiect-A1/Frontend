name: Deploy to Dev

on:
  push:
    branches:
      - dev

jobs:
  deploy:
    name: Deploy Frontend
    runs-on: ubuntu-latest

    steps:
      - name: Executing remote SSH commands
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USERNAME }}
          key: ${{ secrets.VM_SSH_KEY }}
          script_stop: true
          script: |
            set -e 
            echo "Frontend deployment has started..."

            # Mergem în folderul corespondent pentru Frontend
            cd /home/github/sandbox/Frontend

            # Ne asigurăm că tragem de pe branch-ul de dev
            git fetch --all
            git checkout dev
            git reset --hard frontend/dev
            git clean -fd

            # Adăugăm cheia API OpenAI în .env pentru ca Vite să o poată accesa la build
            echo "VITE_OPENAI_API_KEY=${{ secrets.VITE_OPENAI_API_KEY }}" > fiicoder-frontend/.env

            # Ne întoarcem la root /home/github/sandbox și refacem containerul
            cd ../

            # Adăugăm în /etc/environment conform instrucțiunilor (cu fallback securizat pentru a nu crăpa la permisiuni sudo)
            if [ -w /etc/environment ] || sudo -n true 2>/dev/null; then
              sudo sed -i '/VITE_OPENAI_API_KEY/d' /etc/environment || true
              echo "VITE_OPENAI_API_KEY=${{ secrets.VITE_OPENAI_API_KEY }}" | sudo tee -a /etc/environment > /dev/null
              source /etc/environment || true
            else
              echo "⚠️ Warning: Lipsă permisiuni de scriere în /etc/environment. Rămânem la config-ul din fișierul .env."
            fi

            docker compose down frontend && docker compose up --quiet-build --build -d frontend  

            docker image prune -f
            sleep 20
            echo "FRONTEND DEPLOYMENT LOGS"
            docker logs fiicoder-frontend 
            echo "✅ Frontend deployment has finished successfully!"
